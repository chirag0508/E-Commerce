{% extends "base.html" %}

{% block content %}

<div class="box">

<div class="title">Reset Password</div>

<form method="POST">

{% csrf_token %}

<label>New Password</label>
<input type="password" name="password" class="input" required>

<label>Confirm Password</label>
<input type="password" name="confirm_password" class="input" required>

<button class="btn">Reset Password</button>

</form>

</div>

<style>

.box{
width:400px;
margin:80px auto;
background:white;
padding:30px;
border-radius:8px;
box-shadow:0 0 10px rgba(0,0,0,0.1);
}

.title{
font-size:28px;
margin-bottom:20px;
text-align:center;
}

.input{
width:100%;
padding:10px;
margin-top:5px;
margin-bottom:20px;
border:1px solid #ccc;
border-radius:4px;
}

.btn{
width:100%;
padding:12px;
background:#ff9900;
border:none;
font-weight:bold;
cursor:pointer;
cursor:pointer;
}

</style>

{% endblock %}
