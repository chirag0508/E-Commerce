{% extends "base.html" %}

{% block content %}

<div class="box">

<div class="title">Login</div>

<form method="POST">

{% csrf_token %}

<label>Email</label>
<input type="email" name="email" class="input" required>

<label>Password</label>
<input type="password" name="password" class="input" required>

<button class="btn">Login</button>

</form>

<div class="link">
<a href="{% url 'forgot_password' %}">Forgot Password?</a>
</div>

<div class="link">
<a href="{% url 'signup' %}">Create account</a>
</div>

</div>

<style>

.box{
width:400px;
margin:80px auto;
background:white;
padding:30px;
border-radius:8px;
box-shadow:0 0 10px rgba(0,0,0,0.1);
}

.title{
font-size:28px;
margin-bottom:20px;
text-align:center;
}

.input{
width:100%;
padding:10px;
margin-top:5px;
margin-bottom:20px;
border:1px solid #ccc;
border-radius:4px;
}

.btn{
width:100%;
padding:12px;
background:#ff9900;
border:none;
font-weight:bold;
cursor:pointer;
}

.link{
text-align:center;
margin-top:15px;
}

</style>

{% endblock %}
