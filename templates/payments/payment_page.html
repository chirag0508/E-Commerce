<!DOCTYPE html>
<html>
<head>
<title>Secure Payment</title>

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>

<style>

body{
    font-family: Arial, sans-serif;
    background:#f5f5f5;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.payment-card{
    background:white;
    padding:40px;
    border-radius:10px;
    box-shadow:0 5px 20px rgba(0,0,0,0.1);
    text-align:center;
    width:400px;
}

.shop-title{
    font-size:24px;
    font-weight:bold;
    margin-bottom:10px;
}

.amount{
    font-size:32px;
    color:#2ecc71;
    margin:20px 0;
}

.pay-btn{
    background:#3399cc;
    color:white;
    border:none;
    padding:15px 30px;
    font-size:16px;
    border-radius:6px;
    cursor:pointer;
}

.pay-btn:hover{
    background:#287ca3;
}

.secure{
    margin-top:20px;
    font-size:14px;
    color:gray;
}

</style>
</head>

<body>

<div class="payment-card">

<div class="shop-title">My Shop</div>

<h3>Order Payment</h3>

<div class="amount">₹{{ order.total }}</div>

<button id="pay-btn" class="pay-btn">
Pay Securely
</button>

<div class="secure">
🔒 Secure payment powered by Razorpay
</div>

</div>

<script>

var options = {

"key": "{{ razorpay_key }}",
"amount": "{{ amount }}",
"currency": "INR",
"name": "My Shop",
"description": "Order Payment",
"order_id": "{{ payment.id }}",

"handler": function (response){

    var form = document.createElement("form");
    form.method = "POST";
    form.action = "/payments/verify/";

    var csrf = document.createElement("input");
    csrf.type = "hidden";
    csrf.name = "csrfmiddlewaretoken";
    csrf.value = "{{ csrf_token }}";

    var order = document.createElement("input");
    order.type = "hidden";
    order.name = "order_id";
    order.value = "{{ order.id }}";

    var payment_id = document.createElement("input");
    payment_id.type = "hidden";
    payment_id.name = "razorpay_payment_id";
    payment_id.value = response.razorpay_payment_id;

    var order_id = document.createElement("input");
    order_id.type = "hidden";
    order_id.name = "razorpay_order_id";
    order_id.value = response.razorpay_order_id;

    var signature = document.createElement("input");
    signature.type = "hidden";
    signature.name = "razorpay_signature";
    signature.value = response.razorpay_signature;

    form.appendChild(csrf);
    form.appendChild(order);
    form.appendChild(payment_id);
    form.appendChild(order_id);
    form.appendChild(signature);

    document.body.appendChild(form);
    form.submit();
},

"theme": {
    "color": "#3399cc"
}

};

var rzp1 = new Razorpay(options);

document.getElementById('pay-btn').onclick = function(e){

    rzp1.open();
    e.preventDefault();

}

</script>

</body>
</html>
