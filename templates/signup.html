{% extends 'base.html' %}

{% block content %}

<h2>Create Account</h2>

<form method="post">

{% csrf_token %}

<label>Username</label>
{{ form.username }}
{{ form.username.errors }}

<label>Email</label>
{{ form.email }}
{{ form.email.errors }}

<label>Phone</label>
{{ form.phone }}
{{ form.phone.errors }}

<label>Password</label>
{{ form.password }}
{{ form.password.errors }}

<button class="btn">Signup</button>

</form>

<div class="link">
<a href="/accounts/login/">Already have account?</a>
</div>

{% endblock %}
