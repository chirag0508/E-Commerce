<!DOCTYPE html>
<html>

<head>

<title>Shop</title>

<link rel="stylesheet" href="/static/css/style.css">

<!-- Font Awesome for stars -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

body{
font-family: Arial;
margin:0;
background:#f2f2f2;
}

/* navbar */

.nav{
background:#111;
color:white;
padding:15px;
display:flex;
justify-content:space-between;
align-items:center;
}

.nav a{
color:white;
text-decoration:none;
margin-left:15px;
font-weight:bold;
}

.logo{
font-size:22px;
font-weight:bold;
}

/* main container */

.container{
width:90%;
margin:40px auto;
}

/* product grid */

.prd-list{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:20px;
margin-top:20px;
}

.prd-card{
background:white;
padding:20px;
border-radius:6px;
box-shadow:0 0 10px rgba(0,0,0,0.1);
text-align:center;
}

.prd-card img{
margin-bottom:10px;
}

/* buttons */

.btn{
background:#ff9900;
padding:10px 15px;
border:none;
cursor:pointer;
font-weight:bold;
display:inline-block;
text-decoration:none;
color:black;
border-radius:4px;
}

/* inputs */

input, textarea, select{
width:100%;
padding:10px;
margin-top:5px;
margin-bottom:15px;
border:1px solid #ccc;
border-radius:4px;
}

/* links */

.link{
text-align:center;
margin-top:10px;
}

/* product detail */

.prd-detail{
background:white;
padding:30px;
border-radius:6px;
box-shadow:0 0 10px rgba(0,0,0,0.1);
}

.prd-imgs img{
margin-right:10px;
border-radius:5px;
}

/* reviews */

.review-box{
background:white;
padding:20px;
margin-top:20px;
border-radius:6px;
box-shadow:0 0 10px rgba(0,0,0,0.08);
}

.review{
border-bottom:1px solid #eee;
padding:10px 0;
}

.review:last-child{
border-bottom:none;
}

.review-user{
font-weight:bold;
}

.review-rating{
color:#ff9900;
font-weight:bold;
}

/* messages */

.msg{
background:#d4edda;
padding:10px;
margin-bottom:10px;
border-radius:5px;
}

</style>

</head>


<body>

<div class="nav">

<div class="logo">
Shop
</div>

<div>

<a href="/">Home</a>

<a href="{% url 'cart' %}">Cart</a>

<a href="{% url 'user_orders' %}">My Orders</a>

{% if user.is_authenticated %}

<a href="/accounts/logout/">Logout</a>

{% else %}

<a href="/accounts/login/">Login</a>

<a href="/accounts/signup/">Signup</a>

{% endif %}

</div>

</div>


<div class="container">

{% if messages %}

{% for message in messages %}

<div class="msg">
{{ message }}
</div>

{% endfor %}

{% endif %}


{% block content %}

{% endblock %}

</div>

</body>

</html>
